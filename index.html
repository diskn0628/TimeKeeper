    function TimerItem({ 
      timer, 
      onUpdate, 
      onDelete, 
      onMoveUp, 
      onMoveDown, 
      isFirst, 
      isLast, 
      steal, 
      onOpenOutput, 
      onEditLabel,
      refTimer,
      onToggleRef,
      timeOffset = 0
    }) {
      const virtualNow = Date.now() + timeOffset;
      const cardRef = useRef(null);
      const [translateX, setTranslateX] = useState(0);
      const isDraggingRef = useRef(false);
      const startX = useRef(0);
      const startY = useRef(0);
      const isHorizontalMove = useRef(false);
      const currentTx = useRef(0);
      const swipeState = useRef('closed');
      const lastTapTime = useRef(0);
      const hasMoved = useRef(false);
      const swipeLimitLeft = 140;
      const swipeLimitRight = 110;

      const deltaMs = timer.running ? (timer.endAt - virtualNow) : timer.remaining;
      const isOver = deltaMs < 0;
      const offsetMs = steal > 0 ? deltaMs - (steal * 1000) : deltaMs;
      
      const progress = timer.totalMs > 0 ? Math.max(0, Math.min(1, deltaMs / timer.totalMs)) : 1;
      const isNearEnd = !isOver && offsetMs < 10000 && offsetMs > 0 && timer.running;
      const currentColor = isOver ? colors.red : timer.done ? colors.green : isNearEnd ? colors.amber : colors.blue;
      const displayMs = timer.done ? 0 : isOver ? deltaMs : roundUpToSecond(Math.max(0, offsetMs));

      const elapsedTime = Math.max(0, timer.totalMs - deltaMs);

      const isSelfRef = refTimer && refTimer.id === timer.id;
      let diffData = null;

      if (refTimer && !isSelfRef) {
        const refEffective = refTimer.done ? 0 : (refTimer.running ? (refTimer.endAt - virtualNow) : refTimer.remaining);
        const selfEffective = timer.done ? 0 : (timer.running ? (timer.endAt - virtualNow) : timer.remaining);

        const diffMs = refEffective - selfEffective;
        const isDiffMinus = diffMs < 0;
        const displayDiffMs = roundUpToSecond(Math.abs(diffMs));

        diffData = {
          ms: diffMs,
          display: `${isDiffMinus ? "−" : "+"}${formatTime(displayDiffMs)}`,
          status: isDiffMinus ? "不足" : "残余",
          color: isDiffMinus ? colors.red : colors.cyan
        };
      }

      const handlePointerDown = (e) => {
        if (e.target.closest('.no-drag')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        startX.current = e.clientX;
        startY.current = e.clientY;
        isDraggingRef.current = true;
        isHorizontalMove.current = false;
        hasMoved.current = false;

        let initialOffset = 0;
        if (swipeState.current === 'left') initialOffset = -swipeLimitLeft;
        if (swipeState.current === 'right') initialOffset = swipeLimitRight;
        currentTx.current = initialOffset;
      };

      const handlePointerMove = (e) => {
        if (!isDraggingRef.current) return;
        const deltaX = e.clientX - startX.current;
        const deltaY = e.clientY - startY.current;

        if (!isHorizontalMove.current) {
          if (Math.abs(deltaX) > 8 && Math.abs(deltaX) > Math.abs(deltaY)) {
            isHorizontalMove.current = true;
            try { cardRef.current?.setPointerCapture(e.pointerId); } catch (_) {}
          } else if (Math.abs(deltaY) > 8) {
            isDraggingRef.current = false;
            return;
          }
        }

        if (isHorizontalMove.current) {
          hasMoved.current = true;
          let nextTx = currentTx.current + deltaX;
          nextTx = Math.max(-swipeLimitLeft, Math.min(swipeLimitRight, nextTx));
          setTranslateX(nextTx);
        }
      };

      const handlePointerUp = (e) => {
        if (!isDraggingRef.current && !isHorizontalMove.current) return;
        isDraggingRef.current = false;
        try { cardRef.current?.releasePointerCapture(e.pointerId); } catch(_) {}
        
        if (translateX < -swipeLimitLeft * 0.4) {
          setTranslateX(-swipeLimitLeft);
          swipeState.current = 'left';
        } else if (translateX > swipeLimitRight * 0.4) {
          setTranslateX(swipeLimitRight);
          swipeState.current = 'right';
        } else {
          setTranslateX(0);
          swipeState.current = 'closed';
        }
      };

      const handlePointerCancel = (e) => {
        if (!isDraggingRef.current) return;
        isDraggingRef.current = false;
        try { cardRef.current?.releasePointerCapture(e.pointerId); } catch(_) {}
        let orig = 0;
        if (swipeState.current === 'left') orig = -swipeLimitLeft;
        if (swipeState.current === 'right') orig = swipeLimitRight;
        setTranslateX(orig);
      };

      const handleCardClick = (e) => {
        if (e.target.closest('.no-drag')) return;
        if (hasMoved.current) return;

        if (swipeState.current !== 'closed') {
          setTranslateX(0);
          swipeState.current = 'closed';
          return;
        }
        const now = Date.now();
        if (now - lastTapTime.current < 350) {
          lastTapTime.current = 0;
          if (onOpenOutput) onOpenOutput(timer.id);
        } else {
          lastTapTime.current = now;
        }
      };

      const formattedTotal = formatTime(timer.totalMs);
      const displayLabel = timer.label 
        ? `${timer.label} [${formattedTotal}]` 
        : formattedTotal;

      return (
        <div data-id={timer.id} className="relative overflow-hidden rounded-xl mb-[6px] select-none tm-card-h" style={{ height: '102px' }}>
          {/* 右スワイプ裏レイヤー: 経過時間 */}
          <div 
            className="absolute inset-y-0 left-0 flex items-center justify-center bg-blueGlow border-r border-blueCustom/20 no-drag rounded-l-xl transition-opacity duration-150"
            style={{ 
              width: `${swipeLimitRight}px`,
              opacity: translateX > 0 ? Math.min(1, translateX / 40) : 0
            }}
          >
            <div className="text-center p-2">
              <div style={{ ...labelStyle, fontSize: 8, color: colors.blue, marginBottom: 2 }}>経過時間</div>
              <div className="font-mono text-[20px] font-extrabold text-blueCustom leading-none">
                {formatTime(elapsedTime)}
              </div>
            </div>
          </div>

          {/* 左スワイプ裏レイヤー: 編集と削除 */}
          <div 
            className="absolute inset-y-0 right-0 w-[140px] flex no-drag transition-opacity duration-150"
            style={{
              opacity: translateX < 0 ? Math.min(1, Math.abs(translateX) / 40) : 0
            }}
          >
            <button
              onClick={(e) => {
                e.stopPropagation();
                setTranslateX(0);
                swipeState.current = 'closed';
                onEditLabel(timer.id, timer.label || "");
              }}
              className="flex-1 border-none bg-blueCustom text-white font-sans text-xs font-bold cursor-pointer active:brightness-90"
            >
              ✏️<br />ラベル
            </button>
            <button
              onClick={(e) => {
                e.stopPropagation();
                onDelete(timer.id);
              }}
              className="flex-1 border-none bg-redCustom text-white font-sans text-xs font-bold cursor-pointer active:brightness-90"
            >
              🗑<br />削除
            </button>
          </div>

          {/* スライドカード本体 */}
          <div
            ref={cardRef}
            onPointerDown={handlePointerDown}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onPointerCancel={handlePointerCancel}
            onClick={handleCardClick}
            className="relative bg-card border rounded-xl p-[8px_10px_0] select-none h-full transition-[border-color,box-shadow,transform] cursor-grab active:cursor-grabbing"
            style={{
              borderColor: isSelfRef ? colors.cyanCustom : (isOver ? colors.red : timer.done ? colors.green : isNearEnd ? colors.amber : timer.running ? colors.blue + "55" : colors.border),
              boxShadow: isSelfRef ? `0 0 12px ${colors.cyanGlow}` : (isOver ? `0 0 10px ${colors.redGlow}` : "none"),
              transform: `translateX(${translateX}px)`,
              touchAction: 'pan-y'
            }}
          >
            <div className="flex items-center justify-between gap-[4px] pb-2">
              <div className="flex flex-col gap-[2px] shrink-0 no-drag">
                <button 
                  onClick={(e) => { e.stopPropagation(); onMoveUp(); }}
                  className="text-[12px] leading-none cursor-pointer p-0.5 bg-transparent border-none outline-none active:scale-125 font-sans"
                  style={{ color: isFirst ? colors.border : colors.muted, opacity: isFirst ? 0.15 : 0.7 }}
                  disabled={isFirst}
                >
                  ▲
                </button>
                <button 
                  onClick={(e) => { e.stopPropagation(); onMoveDown(); }}
                  className="text-[12px] leading-none cursor-pointer p-0.5 bg-transparent border-none outline-none active:scale-125 font-sans"
                  style={{ color: isLast ? colors.border : colors.muted, opacity: isLast ? 0.15 : 0.7 }}
                  disabled={isLast}
                >
                  ▼
                </button>
              </div>

              <div className="flex-1 min-w-0 px-0.5">
                <div className="flex items-center gap-1 overflow-hidden whitespace-nowrap mb-0.5">
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      onToggleRef(timer.id);
                    }}
                    className="px-1.5 py-[1px] rounded text-[8px] font-sans font-bold tracking-tight shrink-0 border no-drag transition-colors active:scale-95"
                    style={{
                      background: isSelfRef ? colors.cyanCustom : 'transparent',
                      color: isSelfRef ? '#06060e' : colors.mutedLight,
                      borderColor: isSelfRef ? colors.cyanCustom : colors.border
                    }}
                  >
                    {isSelfRef ? "★基準" : "REF"}
                  </button>

                  <div className="font-sans text-[15px] font-bold text-whiteCustom leading-tight overflow-hidden text-ellipsis whitespace-nowrap flex-1">
                    {displayLabel}
                  </div>
                </div>

                <div className="flex items-baseline justify-between gap-1">
                  <div 
                    className="font-mono font-extrabold tracking-tighter leading-none truncate font-tm-digits" 
                    style={{ 
                      color: currentColor, 
                      textShadow: timer.running ? `0 0 8px ${currentColor}33` : "none",
                      fontSize: 'clamp(30px, 9vw, 42px)'
                    }}
                  >
                    {timer.done ? "完了" : formatTime(displayMs)}
                  </div>

                  {diffData && (
                    <div 
                      className="px-1 py-[2px] rounded border flex flex-col items-center leading-none shrink-0"
                      style={{
                        background: diffData.color === colors.red ? colors.redGlow : colors.cyanGlow,
                        borderColor: diffData.color + "66",
                        color: diffData.color
                      }}
                    >
                      <span className="text-[7px] font-sans font-bold uppercase tracking-tight">{diffData.status}</span>
                      <span className="font-mono text-[11px] font-extrabold tracking-tight">{diffData.display}</span>
                    </div>
                  )}
                </div>
              </div>

              <div className="flex flex-col gap-[4px] shrink-0 w-[68px] sm:w-[76px] no-drag">
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    if (timer.running) return;
                    onUpdate({ ...timer, running: false, remaining: timer.totalMs, done: false });
                  }}
                  disabled={timer.running}
                  className="w-full h-[32px] p-0 bg-surface border border-border rounded-[8px] text-mutedCustom text-[14px] font-sans flex items-center justify-center disabled:opacity-25"
                  style={{ cursor: timer.running ? 'not-allowed' : 'pointer' }}
                >
                  ↺
                </button>
                {!timer.running && !timer.done && (
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      const limit = virtualNow + (timer.remaining > 0 ? timer.remaining : timer.totalMs);
                      onUpdate({ ...timer, running: true, endAt: limit, done: false });
                    }}
                    className="w-full h-[48px] bg-blueGlow border border-blueCustom rounded-lg text-blueCustom text-[11px] font-sans font-bold tracking-[1px] cursor-pointer flex items-center justify-center"
                  >
                    {timer.remaining > 0 && timer.remaining < timer.totalMs ? "▶再開" : "▶開始"}
                  </button>
                )}
                {timer.running && (
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      onUpdate({ ...timer, running: false, remaining: deltaMs });
                    }}
                    className="w-full h-[48px] rounded-lg text-[11px] font-sans font-bold tracking-[1px] cursor-pointer flex items-center justify-center"
                    style={{
                      background: isOver ? "rgba(255,74,74,0.2)" : colors.amberGlow,
                      border: `1px solid ${isOver ? colors.red : colors.amber}`,
                      color: isOver ? colors.red : colors.amber
                    }}
                  >
                    ⏸停止
                  </button>
                )}
                {timer.done && (
                  <div className="w-full h-[48px] flex items-center justify-center text-greenCustom text-[11px] font-sans font-bold">
                    ✓完了
                  </div>
                )}
              </div>
            </div>

            <div className="h-1 -mx-2.5 bg-border/20 overflow-hidden">
              <div 
                className="h-full"
                style={{
                  width: `${Math.max(0, Math.min(1, isOver ? 0 : progress)) * 100}%`,
                  background: currentColor,
                  transition: timer.running && !isOver ? "width 0.2s linear" : "width 0.15s ease-out",
                  willChange: "width"
                }}
              />
            </div>
          </div>
        </div>
      );
    }

    function CustomPresetButton({ preset, isSelected, onTap, onLongPress }) {
      const timerRef = useRef(null);
      const isLongPress = useRef(false);

      const handlePointerDown = (e) => {
        e.preventDefault();
        isLongPress.current = false;
        timerRef.current = setTimeout(() => {
          isLongPress.current = true;
          onLongPress();
        }, 600);
      };

      const handlePointerUp = () => {
        clearTimeout(timerRef.current);
        if (!isLongPress.current) {
          onTap();
        }
      };

      const handlePointerCancel = () => {
        clearTimeout(timerRef.current);
        isLongPress.current = false;
      };

      return (
        <button
          onPointerDown={handlePointerDown}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerCancel}
          onPointerLeave={handlePointerCancel}
          onContextMenu={(e) => e.preventDefault()}
          className="px-2.5 py-1 rounded-[7px] text-[10px] font-sans font-semibold cursor-pointer select-none active:scale-95 transition-all duration-200 shrink-0"
          style={{
            background: isSelected ? 'rgba(96,168,255,0.12)' : colors.surface,
            borderColor: isSelected ? colors.blueCustom : colors.border,
            borderWidth: '1px',
            borderStyle: 'solid',
            color: isSelected ? colors.blueCustom : colors.mutedLight,
            boxShadow: isSelected ? `0 0 10px rgba(96,168,255,0.7)` : 'none'
          }}
        >
          {preset.l}
        </button>
      );
    }

    function TimerManager({ 
      timers, 
      setTimers, 
      clipboardVal, 
      stealSec, 
      setStealSec, 
      onOpenOutput, 
      timeOffset = 0,
      quickWords,
      setQuickWords
    }) {
      const [customInput, setCustomInput] = useState("");
      const [labelVal, setLabelVal] = useState("");
      const [selectedPresetMs, setSelectedPresetMs] = useState(0);
      const [anyDragging, setAnyDragging] = useState(false);
      const [labelEditItem, setLabelEditItem] = useState(null);
      const [refTimerId, setRefTimerId] = useState(null);
      const [wordEditTarget, setWordEditTarget] = useState(null);
      const [wordEditInput, setWordEditInput] = useState("");

      const scrollContainerRef = useRef(null);

      const isAnyTimerRunning = timers.some(t => t.running);
      useLowPowerTrigger(isAnyTimerRunning ? "low" : "none");

      const [presets, setPresets] = useState(() => {
        try {
          const saved = localStorage.getItem("tk_tm_presets_v4");
          return saved ? JSON.parse(saved) : [
            { l: "1分", ms: 60000 },
            { l: "2分", ms: 120000 },
            { l: "3分", ms: 180000 },
            { l: "5分", ms: 300000 }
          ];
        } catch(_) {
          return [
            { l: "1分", ms: 60000 },
            { l: "2分", ms: 120000 },
            { l: "3分", ms: 180000 },
            { l: "5分", ms: 300000 }
          ];
        }
      });

      const [presetModalOpen, setPresetModalOpen] = useState(false);
      const [presetEditTarget, setPresetEditTarget] = useState(null);
      const [presetModalLabel, setPresetModalLabel] = useState("");
      const [presetModalInput, setPresetModalInput] = useState("");

      useEffect(() => {
        if (!scrollContainerRef.current) return;

        const sortable = Sortable.create(scrollContainerRef.current, {
          delay: 400,
          delayOnTouchOnly: true,
          touchStartThreshold: 8,
          animation: 200,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          filter: '.no-drag',
          preventOnFilter: false, 
          
          onStart: function () {
            setAnyDragging(true);
            if (navigator.vibrate) navigator.vibrate(30);
          },
          onEnd: function (evt) {
            setAnyDragging(false);
            if (evt.oldIndex == null || evt.newIndex == null || evt.oldIndex === evt.newIndex) return;

            setTimers(prev => {
              const next = [...prev];
              const [moved] = next.splice(evt.oldIndex, 1);
              next.splice(evt.newIndex, 0, moved);
              return next;
            });
          }
        });

        return () => {
          sortable.destroy();
        };
      }, []);

      useEffect(() => {
        if (clipboardVal) setCustomInput(clipboardVal);
      }, [clipboardVal]);

      const parsedCustom = parseInputDigits(customInput);
      const targetMs = parsedCustom ? parsedCustom.ms : selectedPresetMs;

      const addTimerDirect = (ms, label = "") => {
        if (ms <= 0) return;
        const newId = Date.now() + Math.floor(Math.random() * 1000);
        setTimers(prev => [...prev, {
          id: newId,
          label: label,
          totalMs: ms,
          remaining: ms,
          running: false,
          done: false,
          endAt: null
        }]);
      };

      const createTimer = () => {
        if (targetMs <= 0) return;
        addTimerDirect(targetMs, labelVal);
        setLabelVal("");
        setCustomInput("");
        setSelectedPresetMs(0);
      };

      const reorderTimers = (index, direction) => {
        setTimers(prev => {
          const next = [...prev];
          const swapIdx = index + direction;
          if (swapIdx < 0 || swapIdx >= next.length) return prev;
          [next[index], next[swapIdx]] = [next[swapIdx], next[index]];
          return next;
        });
      };

      const handleSaveLabel = () => {
        if (!labelEditItem) return;
        setTimers(prev => prev.map(t => t.id === labelEditItem.id ? { ...t, label: labelEditItem.label.trim() } : t));
        setLabelEditItem(null);
      };

      const openNewPresetDialog = () => {
        setPresetEditTarget(null);
        setPresetModalLabel(labelVal || "");
        setPresetModalInput(customInput || (selectedPresetMs ? formatTo6Digits(selectedPresetMs) : ""));
        setPresetModalOpen(true);
      };

      const openEditPresetDialog = (preset, idx) => {
        setPresetEditTarget({ preset, index: idx });
        setPresetModalLabel(preset.l);
        setPresetModalInput(formatTo6Digits(preset.ms));
        setPresetModalOpen(true);
      };

      const savePreset = () => {
        const parsed = parseInputDigits(presetModalInput);
        if (!parsed) return;
        const l = presetModalLabel || formatFullHMS(parsed.ms);
        const newPreset = { l, ms: parsed.ms };

        let updated;
        if (presetEditTarget !== null) {
          updated = [...presets];
          updated[presetEditTarget.index] = newPreset;
        } else {
          updated = [...presets, newPreset];
        }

        setPresets(updated);
        try { localStorage.setItem("tk_tm_presets_v4", JSON.stringify(updated)); } catch(_) {}
        setPresetModalOpen(false);
      };

      const deletePreset = () => {
        if (presetEditTarget === null) return;
        const updated = presets.filter((_, idx) => idx !== presetEditTarget.index);
        setPresets(updated);
        try { localStorage.setItem("tk_tm_presets_v4", JSON.stringify(updated)); } catch(_) {}
        setPresetModalOpen(false);
      };

      const handleSaveCustomWord = () => {
        if (wordEditTarget === null || !wordEditInput.trim()) return;
        const nextWords = [...quickWords];
        nextWords[wordEditTarget] = wordEditInput.trim();
        setQuickWords(nextWords);
        try { localStorage.setItem("tk_quick_label_words", JSON.stringify(nextWords)); } catch(_) {}
        setWordEditTarget(null);
      };

      const parsedPresetModal = parseInputDigits(presetModalInput);
      const refTimer = timers.find(t => t.id === refTimerId) || null;

      const toggleRefTimer = (id) => {
        setRefTimerId(prev => prev === id ? null : id);
      };

      const virtualNow = Date.now() + timeOffset;

      return (
        <div className="h-full flex flex-col p-[8px_10px] gap-1 overflow-hidden">
          <div className="bg-card rounded-xl p-[8px_10px] border border-border shrink-0 no-drag">
            {/* 盗みボタンを左側に配置して右上の別ウィンドウタイマーとの被りを解消 */}
            <div className="flex items-center gap-1.5 mb-1.5 overflow-x-auto no-scrollbar">
              <QuickOffsetButton value={stealSec} onChange={setStealSec} />
              <div className="w-[1px] h-3.5 bg-border/60 shrink-0" />
              <div className="flex gap-[4px] items-center shrink-0">
                {presets.map((p, idx) => {
                  const isSelected = selectedPresetMs === p.ms && !customInput;
                  return (
                    <CustomPresetButton
                      key={idx}
                      preset={p}
                      isSelected={isSelected}
                      onTap={() => { addTimerDirect(p.ms, p.l); }} 
                      onLongPress={() => openEditPresetDialog(p, idx)}
                    />
                  );
                })}
                <button
                  onClick={openNewPresetDialog}
                  className="px-2 py-1 border border-dashed border-mutedCustom rounded-[7px] text-[10px] text-mutedCustom font-sans font-bold cursor-pointer shrink-0"
                >
                  ＋
                </button>
              </div>
            </div>

            <div className="flex gap-1.5 mb-1.5">
              <div className="relative flex-1">
                <input
                  type="text"
                  name="tm-custom-duration"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck={false}
                  data-form-type="other"
                  data-lpignore="true"
                  value={customInput}
                  onChange={(e) => { setCustomInput(e.target.value.replace(/\D/g, "").slice(0, 6)); setSelectedPresetMs(0); }}
                  onFocus={() => setCustomInput("")}
                  onKeyDown={(e) => e.key === "Enter" && createTimer()}
                  placeholder="設定値 (例: 0300)"
                  className="bg-bg border border-border rounded-lg p-[6px_52px_6px_8px] text-blueCustom text-[15px] font-mono tracking-[1px] outline-none w-full box-border"
                />
                {parsedCustom && (
                  <div className="absolute right-2 top-1/2 -translate-y-1/2 font-mono text-[9px] text-blueCustom opacity-50 pointer-events-none">
                    {parsedCustom.str}
                  </div>
                )}
              </div>
              <input
                type="text"
                name="tm-item-label"
                value={labelVal}
                onChange={(e) => setLabelVal(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && createTimer()}
                placeholder="ラベル"
                autoComplete="off"
                autoCorrect="off"
                autoCapitalize="none"
                spellCheck={false}
                data-form-type="other"
                data-lpignore="true"
                className="w-[90px] bg-bg border border-border rounded-lg p-[6px_8px] text-mutedLight text-[14px] font-sans outline-none"
              />
              <button
                onClick={createTimer}
                className="px-3.5 py-1.5 rounded-lg text-xs font-sans font-bold cursor-pointer border-none shrink-0"
                style={{
                  background: targetMs > 0 ? colors.blue : colors.gray,
                  color: targetMs > 0 ? "#06060e" : colors.muted
                }}
              >
                ＋
              </button>
            </div>

            <div className="flex items-center gap-1.5 overflow-x-auto pb-0.5 no-scrollbar no-drag">
              <span className="text-[8px] text-mutedCustom whitespace-nowrap">長押し編集:</span>
              {quickWords.map((w, idx) => (
                <QuickLabelChip
                  key={idx}
                  word={w}
                  onSelect={(word) => setLabelVal(word)}
                  onLongPress={() => {
                    setWordEditTarget(idx);
                    setWordEditInput(w);
                  }}
                />
              ))}
            </div>
          </div>

          {/* 基準タイマー選択中インジケーター */}
          {refTimer && (
            <div className="bg-cyanCustom/10 border border-cyanCustom/40 rounded-lg px-2.5 py-1 flex items-center justify-between shrink-0 no-drag">
              <div className="flex items-center gap-1.5 overflow-hidden">
                <span className="text-cyanCustom text-[11px] font-bold">★ 基準:</span>
                <span className="font-sans text-[11px] text-whiteCustom truncate max-w-[140px]">
                  {refTimer.label || formatTime(refTimer.totalMs)}
                </span>
                <span className="font-mono text-[11px] text-cyanCustom font-bold">
                  ({formatTime(refTimer.done ? 0 : (refTimer.running ? (refTimer.endAt - virtualNow) : refTimer.remaining))})
                </span>
              </div>
              <button
                onClick={() => setRefTimerId(null)}
                className="text-[9px] text-mutedLight hover:text-white px-1.5 py-0.5 bg-card rounded border border-border cursor-pointer font-sans"
              >
                解除✕
              </button>
            </div>
          )}

          <div 
            ref={scrollContainerRef} 
            className={`flex-1 ${anyDragging ? 'overflow-hidden' : 'overflow-y-auto'}`}
          >
            {timers.length === 0 ? (
              <div className="text-center py-[20px] text-mutedCustom font-sans text-xs border border-dashed border-border rounded-xl no-drag">
                ⏳ タイマーを追加<br />
                <span className="text-[10px] opacity-50">REFタップで基準指定・差分を瞬時に比較</span>
              </div>
            ) : (
              timers.map((t, idx) => (
                <TimerItem
                  key={t.id}
                  timer={t}
                  steal={stealSec}
                  timeOffset={timeOffset}
                  refTimer={refTimer}
                  onToggleRef={toggleRefTimer}
                  isFirst={idx === 0}
                  isLast={idx === timers.length - 1}
                  onUpdate={(updated) => setTimers(prev => prev.map(item => item.id === updated.id ? updated : item))}
                  onDelete={(id) => {
                    setTimers(prev => prev.filter(t => t.id !== id));
                    if (refTimerId === id) setRefTimerId(null);
                  }}
                  onMoveUp={() => reorderTimers(idx, -1)}
                  onMoveDown={() => reorderTimers(idx, 1)}
                  onOpenOutput={onOpenOutput}
                  onEditLabel={(id, label) => setLabelEditItem({ id, label })}
                />
              ))
            )}
          </div>

          {/* ラベル編集モーダル */}
          {labelEditItem && (
            <div 
              className="fixed inset-0 z-[500] bg-black/90 backdrop-blur-[6px] flex items-start justify-center pt-[14vh] p-4"
              onClick={() => setLabelEditItem(null)}
            >
              <div 
                className="bg-card border border-border rounded-[20px] p-[18px] w-full max-w-[320px] shadow-2xl"
                onClick={(e) => e.stopPropagation()}
              >
                <div style={{ ...labelStyle, marginBottom: 10 }}>ラベルを編集</div>
                <input
                  autoFocus
                  type="text"
                  name="edit-tm-label"
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck={false}
                  data-form-type="other"
                  data-lpignore="true"
                  value={labelEditItem.label}
                  onChange={(e) => setLabelEditItem({ ...labelEditItem, label: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && handleSaveLabel()}
                  className="bg-bg border border-blueCustom rounded-[10px] px-[12px] py-2 text-whiteCustom text-[15px] outline-none w-full box-border mb-2"
                  placeholder="ラベルを入力"
                />
                <div className="flex gap-1 overflow-x-auto pb-2 mb-3 no-scrollbar">
                  {quickWords.map((w, idx) => (
                    <button
                      key={idx}
                      type="button"
                      onPointerDown={(e) => { e.preventDefault(); setLabelEditItem({ ...labelEditItem, label: w }); }}
                      className="px-2 py-[3px] bg-surface border border-border rounded-full text-[9px] text-mutedLight font-sans cursor-pointer whitespace-nowrap shrink-0 hover:border-amberCustom hover:text-amberCustom"
                    >
                      {w}
                    </button>
                  ))}
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={handleSaveLabel}
                    className="flex-1 py-2.5 bg-blueCustom rounded-[10px] text-bg text-xs tracking-[1px] font-sans font-bold cursor-pointer border-none"
                  >
                    ✓ 保存
                  </button>
                  <button
                    onClick={() => setLabelEditItem(null)}
                    className="py-2.5 px-4 bg-surface border border-border rounded-[10px] text-mutedCustom text-xs font-sans cursor-pointer"
                  >
                    ✕
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 簡単入力単語 自体の上書き編集モーダル */}
          {wordEditTarget !== null && (
            <div 
              className="fixed inset-0 z-[600] bg-black/90 backdrop-blur-[6px] flex items-start justify-center pt-[14vh] p-4"
              onClick={() => setWordEditTarget(null)}
            >
              <div 
                className="bg-card border border-border rounded-[20px] p-[18px] w-full max-w-[320px] shadow-2xl"
                onClick={(e) => e.stopPropagation()}
              >
                <div style={{ ...labelStyle, marginBottom: 10 }}>定型ボタンの文言を変更</div>
                <input
                  autoFocus
                  type="text"
                  name="edit-quick-word-tm"
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck={false}
                  data-form-type="other"
                  data-lpignore="true"
                  value={wordEditInput}
                  onChange={(e) => setWordEditInput(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && handleSaveCustomWord()}
                  className="bg-bg border border-amberCustom rounded-[10px] px-[12px] py-2 text-amberCustom text-[15px] outline-none w-full box-border mb-3"
                  placeholder="新しい定型ラベル"
                />
                <div className="flex gap-2">
                  <button
                    onClick={handleSaveCustomWord}
                    className="flex-1 py-2.5 bg-amberCustom rounded-[10px] text-bg text-xs tracking-[1px] font-sans font-bold cursor-pointer border-none"
                  >
                    ✓ 更新
                  </button>
                  <button
                    onClick={() => setWordEditTarget(null)}
                    className="py-2.5 px-4 bg-surface border border-border rounded-[10px] text-mutedCustom text-xs font-sans cursor-pointer"
                  >
                    ✕
                  </button>
                </div>
              </div>
            </div>
          )}

          {presetModalOpen && (
            <div 
              className="fixed inset-0 z-[500] bg-black/90 backdrop-blur-[6px] flex items-start justify-center pt-[14vh] p-4"
              onClick={() => setPresetModalOpen(false)}
            >
              <div 
                className="bg-card border border-border rounded-[20px] p-[18px] w-full max-w-[320px] shadow-2xl"
                onClick={(e) => e.stopPropagation()}
              >
                <div style={{ ...labelStyle, marginBottom: 12 }}>
                  {presetEditTarget ? "プリセットを編集" : "プリセットを登録"}
                </div>
                
                <label className="text-[9px] text-mutedLight tracking-[1px] mb-1 block">設定時間 (例: 0500 → 5分)</label>
                <input
                  autoFocus
                  type="text"
                  name="tm-preset-duration"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck={false}
                  data-form-type="other"
                  data-lpignore="true"
                  value={presetModalInput}
                  onChange={(e) => setPresetModalInput(e.target.value.replace(/\D/g, "").slice(0, 6))}
                  placeholder="0300"
                  className="bg-bg border border-amberCustom rounded-[10px] px-[12px] py-2 text-amberCustom text-[18px] font-mono tracking-[3px] outline-none w-full box-border mb-2.5 text-center animate-none"
                />
                
                <label className="text-[9px] text-mutedLight tracking-[1px] mb-1 block">プリセット名称</label>
                <input
                  type="text"
                  name="tm-preset-title"
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck={false}
                  data-form-type="other"
                  data-lpignore="true"
                  value={presetModalLabel}
                  onChange={(e) => setPresetModalLabel(e.target.value)}
                  placeholder={parsedPresetModal ? parsedPresetModal.str : "3分"}
                  className="bg-bg border border-border rounded-[10px] px-[12px] py-2 text-whiteCustom text-[14px] outline-none w-full box-border mb-3 text-center animate-none"
                />

                <div className="flex gap-2">
                  <button
                    onClick={savePreset}
                    disabled={!parsedPresetModal}
                    className="flex-1 py-2.5 bg-amberCustom rounded-[10px] text-bg text-xs tracking-[1px] font-sans font-bold cursor-pointer border-none disabled:opacity-40"
                  >
                    ✓ 保存
                  </button>
                  {presetEditTarget && (
                    <button
                      onClick={deletePreset}
                      className="py-2.5 px-3.5 bg-redCustom/20 border border-redCustom rounded-[10px] text-redCustom text-xs font-sans font-bold cursor-pointer"
                    >
                      🗑
                    </button>
                  )}
                  <button
                    onClick={() => setPresetModalOpen(false)}
                    className="py-2.5 px-3.5 bg-surface border border-border rounded-[10px] text-mutedCustom text-xs font-sans cursor-pointer"
                  >
                    ✕
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function StopwatchManager({ swState, setSwState, clipboardVal, onOpenOutput }) {
      const { running, laps, accumulated, startedAt } = swState;
      const accumulatedRef = useRef(accumulated);
      const startedAtRef = useRef(startedAt);
      const clickTimer = useRef(0);
      const [diffMode, setDiffMode] = useState(false);
      const [customLaps2, setCustomLaps2] = useState([]);

      useEffect(() => { accumulatedRef.current = accumulated; }, [accumulated]);
      useEffect(() => { startedAtRef.current = startedAt; }, [startedAt]);

      useLowPowerTrigger(running ? "high" : "none");

      const elapsed = running ? accumulatedRef.current + (Date.now() - startedAtRef.current) : accumulatedRef.current;

      useEffect(() => {
        if (!clipboardVal) return;
        const parsed = parseInputDigits(clipboardVal);
        if (parsed) {
          accumulatedRef.current = parsed.ms;
          startedAtRef.current = null;
          setSwState({ running: false, accumulated: parsed.ms, startedAt: null, laps: [] });
          setCustomLaps2([]);
        }
      }, [clipboardVal]);

      const toggleRun = () => {
        if (running) {
          const finalElapsed = accumulatedRef.current + (Date.now() - startedAtRef.current);
          accumulatedRef.current = finalElapsed;
          setSwState(prev => ({ ...prev, running: false, accumulated: finalElapsed, startedAt: null }));
        } else {
          const now = Date.now();
          startedAtRef.current = now;
          setSwState(prev => ({ ...prev, running: true, startedAt: now }));
        }
      };

      const resetAll = () => {
        accumulatedRef.current = 0;
        setSwState({ running: false, accumulated: 0, startedAt: null, laps: [] });
        setCustomLaps2([]);
      };

      const recordLap1 = () => {
        if (elapsed === 0) return;
        setSwState(prev => {
          const lastTotal = prev.laps.length > 0 ? prev.laps[prev.laps.length - 1].total : 0;
          const splitVal = elapsed - lastTotal;
          return {
            ...prev,
            laps: [...prev.laps, {
              id: Date.now(),
              total: elapsed,
              split: splitVal,
              firstSplit: elapsed,
              num: prev.laps.length + 1
            }]
          };
        });
      };

      const recordLap2 = () => {
        if (elapsed === 0) return;
        setCustomLaps2(prev => {
          const lastTotal = prev.length > 0 ? prev[prev.length - 1].total : 0;
          return [...prev, {
            id: Date.now(),
            total: elapsed,
            split: elapsed - lastTotal,
            num: prev.length + 1
          }];
        });
      };

      const lastLapTotal = laps.length > 0 ? laps[laps.length - 1].total : 0;
      const currentLapTime = elapsed - lastLapTotal;
      const isLapShort = currentLapTime < 60000;
      const isTotalShort = elapsed < 60000;

      const formatLapNum = (num) => diffMode ? `${num}→${num + 1}` : `#${num}`;

      return (
        <div className="h-full flex flex-col p-[8px_10px] gap-2 overflow-hidden">
          {/* ストップウォッチメイン表示ウィンドウ */}
          <div className="relative text-center bg-card border rounded-[14px] p-[8px_10px_8px] transition-all duration-300 shrink-0"
               style={{ borderColor: running ? colors.green + "55" : colors.border, boxShadow: running ? `0 0 16px ${colors.greenGlow}` : "none" }}>
            
            <button
              onClick={resetAll}
              disabled={elapsed === 0}
              className="absolute top-2 left-2.5 px-[8px] py-[2px] bg-transparent border rounded-[6px] text-[8px] tracking-[1px] font-mono font-bold transition-all duration-150"
              style={{
                borderColor: elapsed > 0 ? colors.border : colors.border + "44",
                color: elapsed > 0 ? colors.muted : colors.gray,
                opacity: elapsed > 0 ? 1 : 0.3
              }}
            >
              RST
            </button>

            {/* 赤枠位置: メイン枠内・左下に#1ボタンを配置（LAP1ボタンと重ならず隙間を確保） */}
            <button
              onClick={() => setDiffMode(prev => !prev)}
              className="absolute bottom-2 left-2.5 px-2 py-0.5 bg-surface border rounded-[6px] text-[9px] tracking-[1px] font-mono font-bold transition-all duration-150 flex items-center gap-1 z-20 no-drag active:scale-95"
              style={{
                borderColor: diffMode ? colors.amber : colors.border,
                color: diffMode ? colors.amber : colors.muted
              }}
            >
              <span className="w-[6px] h-[6px] rounded-full inline-block shrink-0 transition-all duration-150"
                    style={{ background: colors.amber, boxShadow: diffMode ? `0 0 5px ${colors.amber}` : 'none' }} />
              {diffMode ? "1→2" : "#1"}
            </button>

            <div 
              className="pt-[14px] pb-[4px] cursor-pointer"
              onPointerUp={() => {
                const now = Date.now();
                if (now - clickTimer.current < 350) {
                  clickTimer.current = 0;
                  if (onOpenOutput) onOpenOutput();
                } else {
                  clickTimer.current = now;
                }
              }}
            >
              <div className="font-mono text-[14vw] sm:text-[56px] tracking-[1px] leading-none transition-colors duration-300"
                   style={{ color: running ? colors.green : currentLapTime > 0 ? colors.amber : colors.white }}>
                {isLapShort ? formatTimeMs(currentLapTime) : formatTime(currentLapTime)}
              </div>
              <div className="font-mono text-[11px] text-mutedCustom mt-1 tracking-[1px]">
                TOTAL{laps.length > 0 ? `  Lap ${laps.length + 1}` : ""}  /  {isTotalShort ? formatTimeMs(elapsed) : formatTime(elapsed)}
              </div>
            </div>
          </div>

          {/* 操作ボタン列（LAP1ボタンの上の被りを解消） */}
          <div className="flex gap-1.5 shrink-0">
            <div className="flex-1">
              <button
                onClick={recordLap1}
                disabled={!running && elapsed === 0}
                className="w-full py-2 bg-card border border-border rounded-[10px] text-whiteCustom text-[11px] tracking-[1px] font-mono font-bold cursor-pointer leading-[1.2] disabled:opacity-40 active:scale-95"
              >
                <div>LAP1</div>
                <div className="text-[8px] text-mutedCustom font-sans">{diffMode ? "差分" : "分割"}</div>
              </button>
            </div>

            <button
              onClick={toggleRun}
              className="flex-[2] py-2 rounded-[10px] text-[#06060e] text-[13px] tracking-[2px] font-sans font-bold cursor-pointer border-none active:scale-95"
              style={{
                background: running ? colors.red : colors.green,
                boxShadow: running ? `0 0 12px ${colors.redGlow}` : `0 0 12px ${colors.greenGlow}`
              }}
            >
              {running ? "⏸ 停止" : elapsed > 0 ? "▶ 再開" : "▶ スタート"}
            </button>

            <button
              onClick={recordLap2}
              disabled={!running && elapsed === 0}
              className="flex-1 py-2 bg-card border border-border rounded-[10px] text-blueCustom text-[11px] tracking-[1px] font-mono font-bold cursor-pointer leading-[1.2] disabled:opacity-40 active:scale-95"
            >
              <div>LAP2</div>
              <div className="text-[8px] text-mutedCustom font-sans">累積</div>
            </button>
          </div>

          <div className="flex-1 min-h-0 flex gap-1.5 overflow-hidden">
            <div className="flex-1 min-h-0 bg-card border border-border rounded-xl overflow-hidden flex flex-col">
              <div className="p-[4px_8px] border-b border-border/20 shrink-0">
                <div style={{ ...labelStyle, fontSize: 8 }}>
                  LAP1 <span className="opacity-50 tracking-[1px] font-normal">{diffMode ? "差分" : "分割"}</span>
                </div>
              </div>
              {laps.length === 0 ? (
