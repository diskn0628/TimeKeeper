<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Timekeeper iPhone</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- SortableJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#06060e',
            surface: '#0f0f1c',
            card: '#131325',
            cardHover: '#181830',
            border: '#22223a',
            amberCustom: '#f0a030',
            amberDim: '#6b4814',
            redCustom: '#ff4a4a',
            redGlow: 'rgba(255,74,74,0.2)',
            greenCustom: '#28e07a',
            greenGlow: 'rgba(40,224,122,0.15)',
            blueCustom: '#60a8ff',
            blueGlow: 'rgba(96,168,255,0.15)',
            cyanCustom: '#00f0ff',
            cyanGlow: 'rgba(0,240,255,0.15)',
            whiteCustom: '#dce0f8',
            grayCustom: '#44445a',
            mutedCustom: '#666688',
            mutedLight: '#8888aa',
          },
          fontFamily: {
            mono: ["'Share Tech Mono'", "monospace"],
            sans: ["'Rajdhani'", "system-ui", "sans-serif"],
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #06060e;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #root {
      position: absolute;
      inset: 0;
      height: 100%;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      box-sizing: border-box;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #22223a;
      border-radius: 2px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .sortable-ghost {
      opacity: 0.25;
      background-color: #0c0c16 !important;
      border: 1px dashed #f0a030 !important;
    }
    .sortable-chosen {
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.85), 0 0 16px rgba(240,160,48,0.3) !important;
      transform: scale(1.02);
      background-color: rgba(240,160,48,0.12) !important;
      border-color: #f0a030 !important;
      z-index: 50;
    }

    /* iPhone SE / 小画面端末向け 微調整 */
    @media (max-height: 700px), (max-width: 380px) {
      .cd-card-h {
        height: 74px !important;
      }
      .tm-card-h {
        height: 100px !important;
      }
      .font-cd-digits {
        font-size: clamp(26px, 8.5vw, 36px) !important;
      }
      .font-tm-digits {
        font-size: clamp(28px, 9.5vw, 40px) !important;
      }
      .font-header-clock {
        font-size: clamp(28px, 8vw, 34px) !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const defaultQuickLabelWords = ["番組残り", "VTR残り", "コーナー残り", "アナ締めまで"];

    const colors = {
      bg: '#06060e',
      surface: '#0f0f1c',
      card: '#131325',
      cardHover: '#181830',
      border: '#22223a',
      amber: '#f0a030',
      amberDim: '#6b4814',
      amberGlow: 'rgba(240,160,48,0.15)',
      red: '#ff4a4a',
      redGlow: 'rgba(255,74,74,0.2)',
      green: '#28e07a',
      greenGlow: 'rgba(40,224,122,0.15)',
      blue: '#60a8ff',
      blueGlow: 'rgba(96,168,255,0.15)',
      cyan: '#00f0ff',
      cyanGlow: 'rgba(0,240,255,0.15)',
      white: '#dce0f8',
      gray: '#44445a',
      muted: '#666688',
      mutedLight: '#8888aa',
      mono: "'Share Tech Mono','Courier New',monospace",
      sans: "'Rajdhani',system-ui,sans-serif"
    };

    const labelStyle = {
      fontSize: 9,
      letterSpacing: 4,
      color: colors.muted,
      textTransform: 'uppercase',
      fontFamily: colors.sans,
      fontWeight: 600
    };

    const pad = (num) => String(Math.abs(Math.floor(num))).padStart(2, "0");

    function formatTime(ms) {
      const abs = Math.abs(ms);
      const h = Math.floor(abs / 3600000);
      const m = Math.floor((abs % 3600000) / 60000);
      const s = Math.floor((abs % 60000) / 1000);
      const sign = ms < 0 ? "−" : "";
      if (h > 0) {
        return sign + `${pad(h)}:${pad(m)}:${pad(s)}`;
      }
      return sign + `${pad(m)}:${pad(s)}`;
    }

    function formatFullHMS(ms) {
      const abs = Math.abs(ms);
      const h = Math.floor(abs / 3600000);
      const m = Math.floor((abs % 3600000) / 60000);
      const s = Math.floor((abs % 60000) / 1000);
      const sign = ms < 0 ? "−" : "";
      return sign + `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function formatTimeMs(ms) {
      const abs = Math.abs(ms);
      const h = Math.floor(abs / 3600000);
      const m = Math.floor((abs % 3600000) / 60000);
      const s = Math.floor((abs % 60000) / 1000);
      const centi = Math.floor((abs % 1000) / 10);
      const sign = ms < 0 ? "−" : "";
      const timeStr = h > 0 
        ? `${pad(h)}:${pad(m)}:${pad(s)}` 
        : `${pad(Math.floor(abs / 60000))}:${pad(s)}`;
      return `${sign}${timeStr}.${pad(centi)}`;
    }

    function parseInputDigits(str) {
      if (!str) return null;
      const clean = str.trim();
      if (!clean) return null;

      if (clean.endsWith("s")) {
        const val = parseInt(clean.replace(/\D/g, ""), 10);
        if (isNaN(val)) return null;
        const ms = val * 1000;
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return { h, m, s, ms, str: `${val}秒 (${pad(h)}:${pad(m)}:${pad(s)})` };
      }

      if (clean.endsWith("m")) {
        const val = parseInt(clean.replace(/\D/g, ""), 10);
        if (isNaN(val)) return null;
        const ms = val * 60000;
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return { h, m, s, ms, str: `${val}分 (${pad(h)}:${pad(m)}:${pad(s)})` };
      }

      const digits = clean.replace(/\D/g, "").slice(0, 6);
      if (!digits) return null;
      const padded = digits.padStart(6, "0");
      const s = parseInt(padded.slice(4, 6), 10);
      const m = parseInt(padded.slice(2, 4), 10);
      const h = parseInt(padded.slice(0, 2), 10);
      if (s >= 60 || m >= 60) return null;
      const ms = (h * 3600 + m * 60 + s) * 1000;
      return { h, m, s, ms, str: `${pad(h)}:${pad(m)}:${pad(s)}` };
    }

    function parseCalculatorFormula(expr) {
      if (!expr) return 0;
      const tokens = expr.split(/([+-])/).filter(t => t !== "");
      let totalMs = 0;
      let currentOp = "+";
      for (const token of tokens) {
        if (token === "+" || token === "-") {
          currentOp = token;
          continue;
        }
        const parsed = parseInputDigits(token);
        const ms = parsed ? parsed.ms : 0;
        totalMs = currentOp === "+" ? totalMs + ms : totalMs - ms;
      }
      return totalMs;
    }

    function formatCalculatorFormula(expr) {
      if (!expr) return "";
      return expr.split(/([+-])/).map(token => {
        if (token === "+" || token === "-") return token;
        const parsed = parseInputDigits(token);
        if (!parsed) return token;

        if (token.endsWith("s") || token.endsWith("m")) {
          return token;
        }

        const ms = parsed.ms;
        const h = Math.floor(ms / 3600000);
        return h > 0 
          ? `${pad(h)}:${pad(Math.floor((ms % 3600000) / 60000))}:${pad(Math.floor((ms % 60000) / 1000))}` 
          : `${pad(Math.floor(ms / 60000))}:${pad(Math.floor((ms % 60000) / 1000))}`;
      }).join("");
    }

    function endsWithOperator(expr) {
      return !!(expr && /[+-]$/.test(expr));
    }

    function roundUpToSecond(ms) {
      return ms <= 0 ? 0 : Math.ceil(ms / 1000) * 1000;
    }
    
    function formatTo6Digits(ms) {
      const abs = Math.abs(ms);
      const h = Math.floor(abs / 3600000);
      const m = Math.floor((abs % 3600000) / 60000);
      const s = Math.floor((abs % 60000) / 1000);
      const sign = ms < 0 ? "-" : "";
      return `${sign}${pad(h)}${pad(m)}${pad(s)}`;
    }

    function useLowPowerTrigger(mode = "low") {
      const [, setTick] = useState(0);
      const timerRef = useRef(null);
      const [isPageVisible, setIsPageVisible] = useState(!document.hidden);

      useEffect(() => {
        const onVisibilityChange = () => setIsPageVisible(!document.hidden);
        document.addEventListener("visibilitychange", onVisibilityChange);
        return () => document.removeEventListener("visibilitychange", onVisibilityChange);
      }, []);

      useEffect(() => {
        if (!isPageVisible || mode === "none") return;

        if (mode === "high") {
          let active = true;
          const loop = () => {
            if (!active) return;
            setTick(t => t + 1);
            timerRef.current = requestAnimationFrame(loop);
          };
          timerRef.current = requestAnimationFrame(loop);
          return () => {
            active = false;
            if (timerRef.current) cancelAnimationFrame(timerRef.current);
          };
        } else {
          const interval = setInterval(() => {
            setTick(t => t + 1);
          }, 200);
          timerRef.current = interval;
          return () => clearInterval(interval);
        }
      }, [mode, isPageVisible]);
    }

    function QuickLabelChip({ word, onSelect, onLongPress }) {
      const timerRef = useRef(null);
      const isLongPress = useRef(false);

      const handlePointerDown = (e) => {
        e.preventDefault();
        isLongPress.current = false;
        timerRef.current = setTimeout(() => {
          isLongPress.current = true;
          if (navigator.vibrate) navigator.vibrate(40);
          onLongPress(word);
        }, 500);
      };

      const handlePointerUp = () => {
        clearTimeout(timerRef.current);
        if (!isLongPress.current) {
          onSelect(word);
        }
      };

      const handlePointerCancel = () => {
        clearTimeout(timerRef.current);
        isLongPress.current = false;
      };

      return (
        <button
          type="button"
          onPointerDown={handlePointerDown}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerCancel}
          onPointerLeave={handlePointerCancel}
          onContextMenu={(e) => e.preventDefault()}
          className="px-2.5 py-[3px] bg-card border border-border rounded-full text-[10px] text-mutedLight font-sans cursor-pointer shrink-0 whitespace-nowrap active:border-amberCustom active:text-amberCustom transition-colors"
        >
          {word}
        </button>
      );
    }

    function QuickOffsetButton({ value, onChange }) {
      const [showModal, setShowModal] = useState(false);
      const [inputValue, setInputValue] = useState("2");
      const timerRef = useRef(null);
      const isLongPress = useRef(false);
      const backupVal = useRef(value > 0 ? value : 2);
      const modalInputRef = useRef(null);
      const isActive = value > 0;

      const handlePointerDown = (e) => {
        e.preventDefault();
        isLongPress.current = false;
        timerRef.current = setTimeout(() => {
          isLongPress.current = true;
          setInputValue(String(isActive ? value : backupVal.current));
        }, 500);
      };

      const handlePointerUp = () => {
        clearTimeout(timerRef.current);
        if (!isLongPress.current) {
          if (isActive) {
            backupVal.current = value;
            onChange(0);
          } else {
            onChange(backupVal.current || 2);
          }
        } else {
          // 指を離した瞬間(本物のタップ扱い)にモーダル表示とキーボード表示をまとめて行う
          ReactDOM.flushSync(() => setShowModal(true));
          modalInputRef.current?.focus();
        }
      };

      const handlePointerCancel = () => {
        clearTimeout(timerRef.current);
        isLongPress.current = false;
      };

      const saveOffset = () => {
        const val = parseInt(inputValue, 10);
        if (!isNaN(val) && val > 0) {
          backupVal.current = val;
          onChange(val);
        }
        setShowModal(false);
      };

      return (
        <>
          <button
            onPointerDown={handlePointerDown}
            onPointerUp={handlePointerUp}
            onPointerCancel={handlePointerCancel}
            onPointerLeave={handlePointerCancel}
            onContextMenu={(e) => e.preventDefault()}
            className="flex items-center gap-1 px-[9px] py-[3px] text-[9px] font-bold tracking-[1.5px] rounded-[6px] border cursor-pointer select-none transition-all duration-150 shrink-0 no-drag"
            style={{
              background: isActive ? colors.amberGlow : 'transparent',
              borderColor: isActive ? colors.amber : colors.border,
              color: isActive ? colors.amber : colors.muted,
            }}
          >
            <span 
              className="w-[7px] h-[7px] rounded-full inline-block shrink-0 transition-all duration-150" 
              style={{
                background: isActive ? colors.amber : colors.gray,
                boxShadow: isActive ? `0 0 5px ${colors.amber}` : 'none'
              }}
            />
            −{isActive ? value : backupVal.current}秒
          </button>

          {showModal && (
            <div 
              className="fixed inset-0 z-[500] bg-black/90 backdrop-blur-[6px] flex items-start justify-center pt-[14vh] p-5"
              onClick={() => setShowModal(false)}
            >
              <div 
                className="bg-card border border-border rounded-[20px] p-[20px] w-full max-w-[320px] shadow-2xl"
                onClick={(e) => e.stopPropagation()}
              >
                <div style={{ ...labelStyle, marginBottom: 12 }}>何秒早めるか設定</div>
                <input
                  autoFocus
                  ref={modalInputRef}
                  type="text"
                  name="app-timer-offset"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck={false}
                  data-form-type="other"
                  data-lpignore="true"
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value.replace(/\D/g, "").slice(0, 3))}
                  onKeyDown={(e) => e.key === "Enter" && saveOffset()}
                  className="bg-bg border border-amberCustom rounded-[10px] px-[14px] py-2 text-amberCustom text-[24px] font-mono tracking-[4px] outline-none w-full box-border mb-1 text-center"
                />
                <div className="font-mono text-xs text-mutedCustom mb-3.5 text-center tracking-[1px]">
                  {inputValue ? `ターゲット of ${inputValue} 秒前にタイムアップ` : "秒数を入力"}
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={saveOffset}
                    className="flex-[2] py-2.5 bg-amberCustom rounded-[10px] text-bg text-xs tracking-[2px] font-sans font-bold cursor-pointer border-none"
                  >
                    ✓ 設定
                  </button>
                  <button
                    onClick={() => setShowModal(false)}
                    className="flex-[1] py-2.5 bg-surface border border-border rounded-[10px] text-mutedCustom text-xs font-sans cursor-pointer"
                  >
                    ✕
                  </button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    function HeaderClock({ offsetMs, setOffsetMs, onDoubleTap, blockUntilRef }) {
      const [nowTime, setNowTime] = useState(Date.now());
      const [showModal, setShowModal] = useState(false);
      const [inputValue, setInputValue] = useState("");
      
      const animFrameRef = useRef(null);
      const longPressTimerRef = useRef(null);
      const isLongPressed = useRef(false);
      const lastTap = useRef(0);
      const modalInputRef = useRef(null);

      useEffect(() => {
        let active = true;
        const updateLoop = () => {
          if (!active) return;
          setNowTime(Date.now());
          animFrameRef.current = requestAnimationFrame(updateLoop);
        };
        animFrameRef.current = requestAnimationFrame(updateLoop);
        
        return () => {
          active = false;
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, []);

      const targetTime = new Date(nowTime + offsetMs);

      const handlePointerDown = (e) => {
        if (blockUntilRef && Date.now() < blockUntilRef.current) return;
        isLongPressed.current = false;
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
        
        longPressTimerRef.current = setTimeout(() => {
          isLongPressed.current = true;
          setInputValue(`${pad(targetTime.getHours())}${pad(targetTime.getMinutes())}${pad(targetTime.getSeconds())}`);
          if (navigator.vibrate) navigator.vibrate(40);
        }, 600);
      };

      const handlePointerUp = (e) => {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }
        if (blockUntilRef && Date.now() < blockUntilRef.current) {
          isLongPressed.current = false;
          return;
        }
        if (isLongPressed.current) {
          isLongPressed.current = false;
          // 指を離した瞬間(本物のタップ扱い)にモーダル表示とキーボード表示をまとめて行う
          ReactDOM.flushSync(() => setShowModal(true));
          modalInputRef.current?.focus();
          return;
        }

        const now = Date.now();
        if (now - lastTap.current < 300) {
          if (onDoubleTap) onDoubleTap();
          lastTap.current = 0;
        } else {
          lastTap.current = now;
        }
      };

      const handlePointerCancel = () => {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }
        isLongPressed.current = false;
      };

      const saveManualTime = () => {
        const parsed = parseInputDigits(inputValue);
        if (!parsed) return;
        const now = Date.now();
        const targetDate = new Date(now);
        targetDate.setHours(parsed.h, parsed.m, parsed.s, 0);
        setOffsetMs(targetDate.getTime() - now);
        setShowModal(false);
        isLongPressed.current = false;
      };

      return (
        <>
          <div
            onPointerDown={handlePointerDown}
            onPointerUp={handlePointerUp}
            onPointerCancel={handlePointerCancel}
            onPointerLeave={handlePointerCancel}
            className="text-right cursor-pointer select-none leading-[1.05] active:opacity-70"
          >
            <div 
              className="font-mono font-header-clock tracking-[0.5px] font-bold flex items-center justify-end"
              style={{ 
                color: offsetMs !== 0 ? colors.amber : colors.white,
                fontSize: 'clamp(32px, 9.2vw, 42px)'
              }}
            >
              {pad(targetTime.getHours())}:{pad(targetTime.getMinutes())}:{pad(targetTime.getSeconds())}
              {offsetMs !== 0 && <span className="text-[14px] ml-1 text-amberCustom">★</span>}
            </div>
            <div style={{ ...labelStyle, fontSize: 11, marginTop: 1 }}>
              {targetTime.toLocaleDateString("ja-JP", { month: "short", day: "numeric", weekday: "short" })}
            </div>
          </div>

          {showModal && (
            <div
              className="fixed inset-0 z-[500] bg-black/90 backdrop-blur-[6px] flex items-start justify-center pt-[14vh] p-5"
              onClick={() => { setShowModal(false); isLongPressed.current = false; }}
            >
              <div
                className="bg-card border border-border rounded-[20px] p-[20px] w-full max-w-[320px] shadow-2xl"
                onClick={(e) => e.stopPropagation()}
              >
                <div style={{ ...labelStyle, marginBottom: 12 }}>時刻を手動設定</div>
                <input
                  autoFocus
                  ref={modalInputRef}
                  type="text"
                  name="app-header-target-time"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck={false}
                  data-form-type="other"
                  data-lpignore="true"
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value.replace(/\D/g, "").slice(0, 6))}
                  onKeyDown={(e) => e.key === "Enter" && saveManualTime()}
                  className="bg-bg border border-amberCustom rounded-[10px] px-[14px] py-2.5 text-amberCustom text-[24px] font-mono tracking-[4px] outline-none w-full box-border mb-1.5 text-center animate-none"
                />
                <div className="font-mono text-xs text-mutedCustom mb-3.5 pl-1 tracking-[2px] text-center">
                  {parseInputDigits(inputValue) ? `→ ${parseInputDigits(inputValue).str}` : "例: 143000 → 14:30:00"}
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={saveManualTime}
                    className="flex-[2] py-2.5 bg-amberCustom rounded-[10px] text-bg text-xs tracking-[2px] font-sans font-bold cursor-pointer border-none"
                  >
                    ✓ 設定
                  </button>
                  {offsetMs !== 0 && (
                    <button
                      onClick={() => { setOffsetMs(0); setShowModal(false); isLongPressed.current = false; }}
                      className="flex-[1] py-2.5 bg-surface border border-border rounded-[10px] text-mutedCustom text-xs font-sans cursor-pointer"
                    >
                      RST
                    </button>
                  )}
                  <button
                    onClick={() => { setShowModal(false); isLongPressed.current = false; }}
                    className="flex-[1] py-2.5 bg-surface border border-border rounded-[10px] text-mutedCustom text-xs font-sans cursor-pointer"
                  >
                    ✕
                  </button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    function PresetKey({ preset, onTap, onLongPress }) {
      const timerRef = useRef(null);
      const isLongPress = useRef(false);

      const handlePointerDown = (e) => {
        e.preventDefault();
        isLongPress.current = false;
        timerRef.current = setTimeout(() => {
          isLongPress.current = true;
          onLongPress();
        }, 600);
      };

      const handlePointerUp = () => {
        clearTimeout(timerRef.current);
        if (!isLongPress.current) {
          onTap();
        }
      };

      const handlePointerCancel = () => {
        clearTimeout(timerRef.current);
        isLongPress.current = false;
      };

      return (
        <button
          onPointerDown={handlePointerDown}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerCancel}
          onPointerLeave={handlePointerCancel}
          onContextMenu={(e) => e.preventDefault()}
          className="px-2.5 py-1 bg-card border border-amberCustom rounded-[20px] text-amberCustom text-[11px] font-sans font-semibold cursor-pointer tracking-[0.5px] select-none no-drag animate-none shrink-0"
        >
          {preset.label}
          <span className="text-amberDim ml-1 text-[10px]">{preset.str}</span>
        </button>
      );
    }

    function CountdownItem({ item, onDelete, onMoveUp, onMoveDown, isFirst, isLast, steal, tmSteal = 0, onOpenOutput, onEditLabel, timers = [], timeOffset = 0 }) {
      const virtualNow = Date.now() + timeOffset;
      const diffMs = item.target - virtualNow - (steal > 0 ? steal * 1000 : 0);
      const isPast = diffMs <= 0;
      const isNear = diffMs > 0 && diffMs < 60000;
      const currentColor = isPast ? colors.red : isNear ? colors.amber : colors.white;
      const displayMs = isPast ? Math.abs(diffMs) : roundUpToSecond(diffMs);

      const cardRef = useRef(null);
      const [translateX, setTranslateX] = useState(0);
      const isDraggingRef = useRef(false);
      const startX = useRef(0);
      const startY = useRef(0);
      const currentTx = useRef(0);
      const swipeState = useRef('closed');
      const isHorizontalMove = useRef(false);
      const lastTapTime = useRef(0);
      const hasMoved = useRef(false);
      
      const runningTimers = timers.filter(t => t.running);
      const swipeLimitLeft = 140;
      const swipeLimitRight = 200;

      const handlePointerDown = (e) => {
        if (e.target.closest('.no-drag')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        startX.current = e.clientX;
        startY.current = e.clientY;
        isDraggingRef.current = true;
        isHorizontalMove.current = false;
        hasMoved.current = false;
        
        let initialOffset = 0;
        if (swipeState.current === 'left') initialOffset = -swipeLimitLeft;
        if (swipeState.current === 'right') initialOffset = swipeLimitRight;
        currentTx.current = initialOffset;
      };

      const handlePointerMove = (e) => {
        if (!isDraggingRef.current) return;
        const deltaX = e.clientX - startX.current;
        const deltaY = e.clientY - startY.current;

        if (!isHorizontalMove.current) {
          if (Math.abs(deltaX) > 8 && Math.abs(deltaX) > Math.abs(deltaY)) {
            isHorizontalMove.current = true;
            try { cardRef.current?.setPointerCapture(e.pointerId); } catch (_) {}
          } else if (Math.abs(deltaY) > 8) {
            isDraggingRef.current = false;
            return;
          }
        }

        if (isHorizontalMove.current) {
          hasMoved.current = true;
          let nextTx = currentTx.current + deltaX;
          nextTx = Math.max(-swipeLimitLeft, Math.min(swipeLimitRight, nextTx));
          setTranslateX(nextTx);
        }
      };

      const handlePointerUp = (e) => {
        if (!isDraggingRef.current && !isHorizontalMove.current) return;
        isDraggingRef.current = false;
        try { cardRef.current?.releasePointerCapture(e.pointerId); } catch(_) {}
        
        if (translateX < -swipeLimitLeft * 0.4) {
          setTranslateX(-swipeLimitLeft);
          swipeState.current = 'left';
        } else if (translateX > swipeLimitRight * 0.35) {
          setTranslateX(swipeLimitRight);
          swipeState.current = 'right';
        } else {
          setTranslateX(0);
          swipeState.current = 'closed';
        }
      };

      const handlePointerCancel = (e) => {
        if (!isDraggingRef.current) return;
        isDraggingRef.current = false;
        try { cardRef.current?.releasePointerCapture(e.pointerId); } catch(_) {}
        let orig = 0;
        if (swipeState.current === 'left') orig = -swipeLimitLeft;
        if (swipeState.current === 'right') orig = swipeLimitRight;
        setTranslateX(orig);
      };

      const handleCardClick = (e) => {
        if (e.target.closest('.no-drag')) return;
        if (hasMoved.current) return;

        if (swipeState.current !== 'closed') {
          setTranslateX(0);
          swipeState.current = 'closed';
          return;
        }
        const now = Date.now();
        if (now - lastTapTime.current < 350) {
          lastTapTime.current = 0;
          if (onOpenOutput) onOpenOutput(item.id);
        } else {
          lastTapTime.current = now;
        }
      };

      const targetTimeString = new Date(item.target).toLocaleTimeString("ja-JP", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });

      const isRightSwiped = translateX > 20;

      return (
        <div data-id={item.id} className="relative overflow-hidden rounded-xl mb-1.5 select-none cd-card-h" style={{ height: '78px' }}>
          {/* 右スワイプ裏レイヤー: TM稼働計算結果 */}
          <div 
            className="absolute inset-y-0 left-0 flex flex-col justify-center bg-gradient-to-r from-[#031525] to-[#09223a] border-r-2 border-cyanCustom no-drag rounded-l-xl transition-opacity duration-150 px-2.5 z-0"
            style={{ 
              width: `${swipeLimitRight}px`,
              opacity: translateX > 0 ? Math.min(1, translateX / 35) : 0
            }}
          >
            {runningTimers.length === 0 ? (
              <div className="flex flex-col items-start justify-center h-full">
                <div className="flex items-center gap-1 text-[10px] font-bold text-cyanCustom tracking-wide uppercase">
                  <span>✦ TMタイマー差分</span>
                </div>
                <div className="font-sans text-[11px] text-mutedLight mt-0.5">稼働中のタイマーなし</div>
              </div>
            ) : runningTimers.length === 1 ? (
              (() => {
                const tm = runningTimers[0];
                const tmRemaining = Math.max(0, (tm.endAt - virtualNow) - (tmSteal > 0 ? tmSteal * 1000 : 0));
                const subDiff = diffMs - tmRemaining;
                const isSubPast = subDiff < 0;
                const displaySubMs = roundUpToSecond(Math.abs(subDiff));
                const subColor = isSubPast ? colors.red : colors.cyan;

                return (
                  <div className="flex flex-col justify-center h-full">
                    <div className="flex items-center justify-between gap-1 mb-0.5">
                      <span className="text-[8px] font-bold tracking-[1px] uppercase truncate" style={{ color: subColor }}>
                        {isSubPast ? "⚠️ CD先行/不足" : "✓ TM後余力"}
                      </span>
                      <span className="font-sans text-[10px] text-whiteCustom truncate font-bold max-w-[80px]">
                        {tm.label || formatTime(tm.totalMs)}
                      </span>
                    </div>
                    
                    <div className="flex items-baseline gap-1.5">
                      <div 
                        className="font-mono text-[26px] font-extrabold leading-none tracking-tight"
                        style={{ color: subColor, textShadow: `0 0 10px ${subColor}55` }}
                      >
                        {isSubPast ? "−" : "+"}{formatTime(displaySubMs)}
                      </div>
                      <span className="text-[9px] font-bold font-sans" style={{ color: subColor }}>
                        {isSubPast ? "不足" : "残"}
                      </span>
                    </div>

                    <div className="font-mono text-[8px] text-mutedLight/70 flex justify-between mt-0.5">
                      <span>TM残:{formatTime(tmRemaining)}</span>
                      <span>CD残:{formatTime(diffMs)}</span>
                    </div>
                  </div>
                );
              })()
            ) : (
              <div className="flex flex-col gap-1 overflow-y-auto max-h-[70px] pr-1 py-0.5">
                <div className="text-[8px] font-bold text-cyanCustom tracking-[1px] uppercase sticky top-0 bg-[#031525] pb-0.5">
                  TM終了後のCD余力
                </div>
                {runningTimers.map((tm) => {
                  const tmRemaining = Math.max(0, (tm.endAt - virtualNow) - (tmSteal > 0 ? tmSteal * 1000 : 0));
                  const subDiff = diffMs - tmRemaining;
                  const isSubPast = subDiff < 0;
                  const displaySubMs = roundUpToSecond(Math.abs(subDiff));
                  const subColor = isSubPast ? colors.red : colors.cyan;

                  return (
                    <div key={tm.id} className="flex justify-between items-center border-b border-white/10 pb-0.5">
                      <span className="font-sans text-[10px] text-whiteCustom font-bold truncate max-w-[80px]">
                        {tm.label || formatTime(tm.totalMs)}
                      </span>
                      <span className="font-mono text-[13px] font-extrabold" style={{ color: subColor }}>
                        {isSubPast ? "−" : "+"}{formatTime(displaySubMs)}
                      </span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* 左スワイプ裏レイヤー: 編集と削除 */}
          <div 
            className="absolute inset-y-0 right-0 w-[140px] flex no-drag transition-opacity duration-150 z-0"
            style={{
              opacity: translateX < 0 ? Math.min(1, Math.abs(translateX) / 35) : 0
            }}
          >
            <button
              onClick={(e) => {
                e.stopPropagation();
                setTranslateX(0);
                swipeState.current = 'closed';
                onEditLabel(item.id, item.label || "");
              }}
              className="flex-1 border-none bg-blueCustom text-white font-sans text-xs font-bold cursor-pointer active:brightness-90"
            >
              ✏️<br />ラベル
            </button>
            <button
              onClick={(e) => {
                e.stopPropagation();
                onDelete(item.id);
              }}
              className="flex-1 border-none bg-redCustom text-white font-sans text-xs font-bold cursor-pointer active:brightness-90"
            >
              🗑<br />削除
            </button>
          </div>

          {/* スライドカード表面 */}
          <div
            ref={cardRef}
            onPointerDown={handlePointerDown}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onPointerCancel={handlePointerCancel}
            onClick={handleCardClick}
            className="relative bg-card border rounded-xl p-[6px_8px] flex items-center gap-1.5 select-none h-full transition-[border-color,box-shadow,transform] cursor-grab active:cursor-grabbing z-10"
            style={{
              borderColor: isPast ? colors.red : isNear ? colors.amber : isRightSwiped ? colors.cyanCustom : colors.border,
              boxShadow: isPast ? `0 0 10px ${colors.redGlow}` : isRightSwiped ? `0 0 12px ${colors.cyanGlow}` : "none",
              transform: `translateX(${translateX}px)`,
              touchAction: 'pan-y'
            }}
          >
            <div 
              className="absolute left-0 top-0 bottom-0 w-[3px] rounded-[12px_0_0_12px]" 
              style={{ background: currentColor, opacity: isPast ? 1 : isNear ? 0.9 : 0.35 }}
            />
            
            <div className="flex flex-col gap-[1px] pl-1 shrink-0 no-drag">
              <button 
                onClick={(e) => { e.stopPropagation(); onMoveUp(); }}
                className="text-[11px] leading-none cursor-pointer p-0.5 bg-transparent border-none outline-none active:scale-125 font-sans"
                style={{ color: isFirst ? colors.border : colors.muted, opacity: isFirst ? 0.15 : 0.7 }}
                disabled={isFirst}
              >
                ▲
              </button>
              <button 
                onClick={(e) => { e.stopPropagation(); onMoveDown(); }}
                className="text-[11px] leading-none cursor-pointer p-0.5 bg-transparent border-none outline-none active:scale-125 font-sans"
                style={{ color: isLast ? colors.border : colors.muted, opacity: isLast ? 0.15 : 0.7 }}
                disabled={isLast}
              >
                ▼
              </button>
            </div>

            <div className="flex-1 min-w-0 pr-1">
              <div className="font-sans text-[13px] text-mutedLight mb-[1px] tracking-[0.5px] flex items-baseline gap-1 overflow-hidden whitespace-nowrap">
                {item.label && <span className="text-whiteCustom font-bold overflow-hidden text-ellipsis max-w-[80px] shrink-0">{item.label}</span>}
                <span className="font-mono text-[11px] text-mutedCustom shrink-0">{targetTimeString} まで</span>
                {steal > 0 && <span className="text-amberDim text-[10px] shrink-0">−{steal}s</span>}
                {isPast && <span className="text-redCustom text-[10px] shrink-0 font-bold">経過</span>}
                {isNear && !isPast && <span className="text-amberCustom text-[10px] shrink-0">⚡</span>}
              </div>
              <div 
                className="font-mono font-bold tracking-[0.5px] leading-none font-cd-digits truncate"
                style={{ 
                  color: currentColor,
                  fontSize: isRightSwiped ? '24px' : 'clamp(28px, 9vw, 36px)'
                }}
              >
                {isPast ? "+" : ""}{formatTime(displayMs)}
              </div>
            </div>

            <div className="shrink-0 flex flex-col items-end justify-center pl-1 border-l border-white/5 no-drag">
              {isRightSwiped ? (
                <div className="text-right">
                  <div className="text-[8px] font-bold text-amberCustom tracking-wide">CD現在値</div>
                  <div className="text-[9px] font-mono text-mutedLight">戻す</div>
                </div>
              ) : (
                runningTimers.length > 0 && (
                  <div className="flex items-center gap-0.5 text-[9px] text-cyanCustom font-bold tracking-tight bg-cyanCustom/10 px-1.5 py-0.5 rounded border border-cyanCustom/40">
                    <span>▶TM差</span>
                  </div>
                )
              )}
            </div>
          </div>
        </div>
      );
    }

    function CountdownManager({ 
      targets, 
      setTargets, 
      clipboardVal, 
      stealSec, 
      setStealSec, 
      tmStealSec = 0, 
      onOpenOutput, 
      timers = [], 
      timeOffset = 0,
      quickWords,
      setQuickWords
    }) {
      const [inputVal, setInputVal] = useState("");
      const [labelVal, setLabelVal] = useState("");
      const [presets, setPresets] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("tk_cd_presets") || "[]");
        } catch(_) { return []; }
      });
      const [presetModalOpen, setPresetModalOpen] = useState(false);
      const [presetEditTarget, setPresetEditTarget] = useState(null);
      const [presetModalLabel, setPresetModalLabel] = useState("");
      const [presetModalInput, setPresetModalInput] = useState("");
      const [anyDragging, setAnyDragging] = useState(false);
      const [labelEditItem, setLabelEditItem] = useState(null);
      const [wordEditTarget, setWordEditTarget] = useState(null);
      const [wordEditInput, setWordEditInput] = useState("");

      const inputRef = useRef(null);
      const scrollContainerRef = useRef(null);

      useLowPowerTrigger(targets.length > 0 || timers.some(t => t.running) ? "low" : "none");

      useEffect(() => {
        if (!scrollContainerRef.current) return;

        const sortable = Sortable.create(scrollContainerRef.current, {
          delay: 400,
          delayOnTouchOnly: true,
          touchStartThreshold: 8,
          animation: 200,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          filter: '.no-drag',
          preventOnFilter: false,
          
          onStart: function () {
            setAnyDragging(true);
            if (navigator.vibrate) navigator.vibrate(30);
          },
          onEnd: function (evt) {
            setAnyDragging(false);
            if (evt.oldIndex == null || evt.newIndex == null || evt.oldIndex === evt.newIndex) return;

            setTargets(prev => {
              const next = [...prev];
              const [moved] = next.splice(evt.oldIndex, 1);
              next.splice(evt.newIndex, 0, moved);
              return next;
            });
          }
        });

        return () => {
          sortable.destroy();
        };
      }, []);

      useEffect(() => {
        if (clipboardVal) setInputVal(clipboardVal);
      }, [clipboardVal]);

      const addTarget = (rawTime, label) => {
        const parsed = parseInputDigits(rawTime);
        if (!parsed) return;
        const virtualNow = Date.now() + timeOffset;
        const now = new Date(virtualNow);
        now.setHours(parsed.h, parsed.m, parsed.s, 0);
        let targetMs = now.getTime();
        if (targetMs <= virtualNow) {
          targetMs += 86400000;
        }
        setTargets(prev => [...prev, { id: Date.now() + Math.random(), target: targetMs, label }]);
      };

      const handleAddSubmit = () => {
        if (parsedInput) {
          addTarget(inputVal, labelVal);
          setLabelVal("");
          setInputVal("");
          inputRef.current?.focus();
        }
      };

      const openNewPresetDialog = () => {
        setPresetEditTarget(null);
        setPresetModalLabel(labelVal || "");
        setPresetModalInput(inputVal || "");
        setPresetModalOpen(true);
      };

      const openEditPresetDialog = (preset, idx) => {
        setPresetEditTarget({ preset, index: idx });
        setPresetModalLabel(preset.label);
        setPresetModalInput(preset.raw);
        setPresetModalOpen(true);
      };

      const savePreset = () => {
        const parsed = parseInputDigits(presetModalInput);
        if (!parsed) return;
        const label = presetModalLabel || parsed.str;
        const newPreset = {
          id: presetEditTarget ? presetEditTarget.preset.id : Date.now(),
          raw: presetModalInput,
          label,
          str: parsed.str
        };

        let updated;
        if (presetEditTarget !== null) {
          updated = [...presets];
          updated[presetEditTarget.index] = newPreset;
        } else {
          updated = [...presets, newPreset];
        }

        setPresets(updated);
        try { localStorage.setItem("tk_cd_presets", JSON.stringify(updated)); } catch(_) {}
        setPresetModalOpen(false);
      };

      const deletePreset = () => {
        if (presetEditTarget === null) return;
        const updated = presets.filter((_, idx) => idx !== presetEditTarget.index);
        setPresets(updated);
        try { localStorage.setItem("tk_cd_presets", JSON.stringify(updated)); } catch(_) {}
        setPresetModalOpen(false);
      };

      const reorderItems = (index, direction) => {
        setTargets(prev => {
          const next = [...prev];
          const swapIdx = index + direction;
          if (swapIdx < 0 || swapIdx >= next.length) return prev;
          [next[index], next[swapIdx]] = [next[swapIdx], next[index]];
          return next;
        });
      };

      const handleSaveLabel = () => {
        if (!labelEditItem) return;
        setTargets(prev => prev.map(t => t.id === labelEditItem.id ? { ...t, label: labelEditItem.label.trim() } : t));
        setLabelEditItem(null);
      };

      const handleSaveCustomWord = () => {
        if (wordEditTarget === null || !wordEditInput.trim()) return;
        const nextWords = [...quickWords];
        nextWords[wordEditTarget] = wordEditInput.trim();
        setQuickWords(nextWords);
        try { localStorage.setItem("tk_quick_label_words", JSON.stringify(nextWords)); } catch(_) {}
        setWordEditTarget(null);
      };

      const parsedInput = parseInputDigits(inputVal);
      const parsedPresetModal = parseInputDigits(presetModalInput);

      return (
        <div className="h-full flex flex-col p-[8px_10px] gap-1 overflow-hidden">
          <div className="shrink-0 no-drag">
            <div style={{ ...labelStyle, fontSize: 8, marginBottom: 4 }}>
              プリセット <span className="opacity-40">長押しで編集</span>
            </div>
            <div className="flex gap-[5px] overflow-x-auto pb-1 no-scrollbar">
              {presets.map((p, idx) => (
                <PresetKey 
                  key={p.id} 
                  preset={p} 
                  onTap={() => addTarget(p.raw, p.label)} 
                  onLongPress={() => openEditPresetDialog(p, idx)}
                />
              ))}
              <button
                onClick={openNewPresetDialog}
                className="px-2 py-1 border border-dashed border-mutedCustom rounded-[7px] text-[10px] text-mutedCustom font-sans font-bold cursor-pointer shrink-0"
              >
                ＋
              </button>
            </div>
          </div>

          <div className="bg-card rounded-xl p-[8px_10px] border border-border shrink-0 no-drag">
            <div className="flex items-center gap-2 mb-1">
              <div style={{ ...labelStyle, fontSize: 8 }}>時刻追加</div>
              <QuickOffsetButton value={stealSec} onChange={setStealSec} />
            </div>

            <div className="relative mb-1">
              <input
                ref={inputRef}
                type="text"
                name="cd-target-digits"
                inputMode="numeric"
                pattern="[0-9]*"
                autoComplete="off"
                autoCorrect="off"
                autoCapitalize="none"
                spellCheck={false}
                data-form-type="other"
                data-lpignore="true"
                value={inputVal}
                onChange={(e) => setInputVal(e.target.value.replace(/\D/g, "").slice(0, 6))}
                onFocus={() => setInputVal("")}
                onKeyDown={(e) => e.key === "Enter" && handleAddSubmit()}
                placeholder="時刻 (例: 1430)"
                className="bg-bg border border-border rounded-lg p-[6px_60px_6px_8px] text-amberCustom text-[18px] font-mono tracking-[2px] outline-none w-full box-border text-center animate-none"
              />
              {parsedInput && (
                <div className="absolute right-2.5 top-1/2 -translate-y-1/2 font-mono text-[10px] text-amberDim pointer-events-none animate-none">
                  {parsedInput.str}
                </div>
              )}
            </div>

            <div className="flex gap-1.5 mb-1.5">
              <input
                type="text"
                name="cd-item-label"
                value={labelVal}
                onChange={(e) => setLabelVal(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && handleAddSubmit()}
                placeholder="ラベル（省略可）"
                autoComplete="off"
                autoCorrect="off"
                autoCapitalize="none"
                spellCheck={false}
                data-form-type="other"
                data-lpignore="true"
                className="flex-1 min-w-0 bg-bg border border-border rounded-lg p-[6px_8px] text-mutedLight text-[14px] font-sans outline-none animate-none"
              />
              <button
                onClick={handleAddSubmit}
                disabled={!parsedInput}
                className="px-3.5 py-1.5 rounded-lg text-xs font-sans font-bold cursor-pointer shrink-0"
                style={{
                  background: parsedInput ? colors.amber : colors.gray,
                  color: parsedInput ? "#06060e" : colors.muted
                }}
              >
                ＋
              </button>
            </div>

            {/* ラベル簡単入力（一列・横スクロール & 長押し編集対応） */}
            <div className="flex items-center gap-1.5 overflow-x-auto pb-0.5 no-scrollbar no-drag">
              <span className="text-[8px] text-mutedCustom whitespace-nowrap">長押し編集:</span>
              {quickWords.map((w, idx) => (
                <QuickLabelChip
                  key={idx}
                  word={w}
                  onSelect={(word) => setLabelVal(word)}
                  onLongPress={() => {
                    setWordEditTarget(idx);
                    setWordEditInput(w);
                  }}
                />
              ))}
            </div>
          </div>

          <div 
            ref={scrollContainerRef} 
            className={`flex-1 ${anyDragging ? 'overflow-hidden' : 'overflow-y-auto'}`}
          >
            {targets.length === 0 ? (
              <div className="text-center py-[20px] text-mutedCustom font-sans text-xs border border-dashed border-border rounded-xl no-drag">
                ⏳ カウントダウンを追加<br />
                <span className="text-[10px] opacity-60 text-cyanCustom">👉右スワイプでTM稼働差分を確認</span>
              </div>
            ) : (
              targets.map((item, idx) => (
                <CountdownItem
                  key={item.id}
                  item={item}
                  steal={stealSec}
                  tmSteal={tmStealSec}
                  timers={timers}
                  timeOffset={timeOffset}
                  isFirst={idx === 0}
                  isLast={idx === targets.length - 1}
                  onDelete={(id) => setTargets(prev => prev.filter(t => t.id !== id))}
                  onMoveUp={() => reorderItems(idx, -1)}
                  onMoveDown={() => reorderItems(idx, 1)}
                  onOpenOutput={onOpenOutput}
                  onEditLabel={(id, label) => setLabelEditItem({ id, label })}
                />
              ))
            )}
          </div>

          {/* ラベル編集モーダル */}
          {labelEditItem && (
            <div 
              className="fixed inset-0 z-[500] bg-black/90 backdrop-blur-[6px] flex items-start justify-center pt-[14vh] p-4"
              onClick={() => setLabelEditItem(null)}
            >
              <div

                <input

                  onKeyDown={(e) => e.key === "Enter" && handleSaveCustomWord()}
                  className="bg-bg border border-amberCustom rounded-[10px] px-[12px] py-2 text-amberCustom text-[15px] outline-none w-full box-border mb-3"

                <div className="flex gap-2">

                  <button

          {presetModalOpen && (

              <div 
                className="bg-card border border-border rounded-[20px] p-[18px] w-full max-w-[320px] shadow-2xl"
                onClick={(e) => e.stopPropagation()}

                <div style={{ ...labelStyle, marginBottom: 12 }}>
                  {presetEditTarget ? "プリセットを編集" : "プリセットを登録"}

                <label className="text-[9px] text-mutedLight tracking-[1px] mb-1 block">時刻 (例: 1430)</label>
                <input
                  autoFocus

                  spellCheck={false}
                  data-form-type="other"
                  data-lpignore="true"
                  value={presetModalInput}
                  onChange={(e) => setPresetModalInput(e.target.value.replace(/\D/g, "").slice(0, 6))}
                  placeholder="1430"
                  className="bg-bg border border-amberCustom rounded-[10px] px-[12px] py-2 text-amberCustom text-[18px] font-mono tracking-[3px] outline-none w-full box-border mb-2.5 text-center animate-none"
                />

                <label className="text-[9px] text-mutedLight tracking-[1px] mb-1 block">プリセット名称</label>
                <input
                  type="text"
                  name="cd-preset-title"

                  autoCorrect="off"
                  autoCapitalize="none"

                  data-lpignore="true"

                  onChange={(e) => setPresetModalLabel(e.target.value)}
                  placeholder={parsedPresetModal ? parsedPresetModal.str : "ラベル（省略可）"}

                <div className="flex gap-2">
                  <button
                    onClick={savePreset}
